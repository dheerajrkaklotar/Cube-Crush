name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          echo "Detected Java version line: ${JAVA_VER_LINE}"
          JAVA_MAJOR="$(echo "${JAVA_VER_LINE}" | sed -E 's/.*version "([0-9]+)(\.[0-9]+)*.*".*/\1/')"
          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to detect active Java major version from: ${JAVA_VER_LINE}"
            exit 1
          fi
          echo "Detected active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Active Java major version (${JAVA_MAJOR}) is lower than 17. Java 17 or newer is required."
            exit 1
          fi
          echo "Confirmed active Java major version ${JAVA_MAJOR} (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "Temporary debug keystore already exists at ${KEYSTORE_PATH}."
          else
            echo "Generating temporary debug keystore at ${KEYSTORE_PATH}..."
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt > /dev/null 2>&1
          fi
          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "::error::Failed to create temporary debug keystore at ${KEYSTORE_PATH}."
            exit 1
          fi
          echo "Confirmed temporary debug keystore exists at ${KEYSTORE_PATH}."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK was not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty (0 bytes)."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::Selected file does not have the .apk extension: ${EXPECTED_APK}"
              exit 1
              ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path (${EXPECTED_APK}) is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "Confirmed valid non-empty debug APK at ${EXPECTED_APK}."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified APK missing or empty at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_DIR="${RUNNER_TEMP}/release-apk-asset-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RELEASE_ASSET_DIR}"

          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"
          cp "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to prepare release APK asset at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_filename=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::warning::Prepared release asset is missing or empty (${ASSET_PATH}). Skipping release creation."
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not have a .apk extension (${ASSET_PATH})."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automatically Generated Debug APK

          - **Generated By**: GitHub Actions (automated debug build workflow)
          - **GitHub Actions Run Number**: \`${GITHUB_RUN_NUMBER}\`
          - **GitHub Actions Run Attempt**: \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA**: \`${GITHUB_SHA}\`
          - **Intended Purpose**: Testing and verification only
          - **Production Status**: This APK is **not** a Google Play Store production release
          - **Signing Status**: Signed only with a temporary debug keystore generated during the CI run
          EOF
          )

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}#${ASSET_FILENAME}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "${RELEASE_OUTCOME}" = "success" ] && gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url -q .url)"
            echo "=========================================="
            echo "GitHub Release Published Successfully!"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"
            echo "Download the APK directly from the release Assets section."
            echo "The normal Actions artifact (app-debug-apk) is also available as a backup."
            echo "=========================================="

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **APK Build Status**: Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions Artifact**: \`app-debug-apk\` (Uploaded and available as a backup)"
              echo "- **Release Status**: Published"
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename**: \`${ASSET_FILENAME}\`"
              echo "- **Direct GitHub Release URL**: [${RELEASE_URL}](${RELEASE_URL})"
              echo ""
              echo "You can download \`${ASSET_FILENAME}\` directly from the **Assets** section on the GitHub Release page above, or use the \`app-debug-apk\` GitHub Actions artifact as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing did not complete. However, the APK build succeeded and the Actions artifact named 'app-debug-apk' remains available for download."
            {
              echo "## Debug APK Build Summary (Release Warning)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed or was skipped."
              echo ""
              echo "- **APK Build Status**: Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Download Available**: The GitHub Actions artifact named **\`app-debug-apk\`** was uploaded prior to the release step and remains available on the workflow run summary page."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
